$schema: https://json-schema.org/draft/2020-12/schema
$id: knowledge.schema.yaml
type: object
additionalProperties: false
required: [schema_version, id, status, statement, applicability, limitations, evidence_refs, validation_refs, origin_mission_id, origin_goal_id, origin_execution_id, origin_classification_refs, reuse_assessment_refs, validated_at, validated_by, reuse_guidance, approval_refs, decision_ref, supersedes]
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, pattern: '^KNOW-[0-9]{3,}$'}
  status: {type: string, enum: [candidate, validated, deprecated, rejected]}
  statement: {type: string, minLength: 1}
  applicability:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  limitations:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  evidence_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  validation_refs:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^VAL-[0-9]{3,}$'}
  origin_mission_id: {type: string, minLength: 1}
  origin_goal_id: {type: string, minLength: 1}
  origin_execution_id: {type: string, pattern: '^EX-[0-9]{8}T[0-9]{6}Z-[0-9]{3}$'}
  origin_classification_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^CLASS-[0-9]{3,}$'}
  reuse_assessment_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^REUSE-[0-9]{3,}$'}
  validated_at: {type: [string, 'null'], format: date-time}
  validated_by: {type: [string, 'null'], minLength: 1}
  reuse_guidance: {type: string, minLength: 1}
  approval_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  decision_ref: {type: [string, 'null']}
  supersedes:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^KNOW-[0-9]{3,}$'}
allOf:
  - if:
      properties: {status: {const: validated}}
      required: [status]
    then:
      properties:
        validation_refs: {minItems: 1}
        validated_at: {type: string, format: date-time}
        validated_by: {type: string, minLength: 1}
  - if:
      properties: {status: {const: deprecated}}
      required: [status]
    then:
      properties:
        supersedes: {minItems: 1}
        decision_ref: {type: string, minLength: 1}
        reuse_guidance: {type: string, minLength: 1}
