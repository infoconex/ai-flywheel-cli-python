$schema: https://json-schema.org/draft/2020-12/schema
$id: approval-record.schema.yaml
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - kind
  - mission_id
  - goal_id
  - execution_id
  - created_at
  - created_by
  - summary
  - status
  - source_refs
  - artifact_refs
  - approval
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, pattern: '^APPROVAL-[0-9]{3,}$'}
  kind: {type: string, const: approval}
  mission_id: {type: string, minLength: 1}
  goal_id: {type: string, minLength: 1}
  execution_id: {type: [string, 'null'], minLength: 1}
  created_at:
    type: string
    format: date-time
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
  created_by: {type: string, minLength: 1}
  summary: {type: string, minLength: 1}
  status: {type: string, enum: [accepted, rejected, superseded, closed]}
  classification: {type: [string, 'null']}
  criterion_ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^AC-[0-9]{3,}$'}
  source_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  artifact_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  approval:
    type: object
    additionalProperties: false
    required:
      - authority_id
      - authority_role
      - authorization_basis
      - decision
      - scope
      - decided_at
      - effective_at
      - expires_at
      - evidence_refs
      - delegation_ref
      - supersedes_ref
      - revokes_ref
    properties:
      authority_id: {type: string, pattern: '^AUTH-[A-Z0-9][A-Z0-9-]*$'}
      authority_role: {type: string, enum: [repository-owner, delegate]}
      authorization_basis: {type: string, enum: [repository-ownership, delegated-authority]}
      decision: {type: string, enum: [approved, rejected, deferred]}
      scope:
        type: object
        additionalProperties: false
        required:
          - mission_id
          - goal_id
          - execution_id
          - action
          - target_refs
          - constraints
          - delegate_authority_id
          - delegated_actions
          - delegated_target_refs
        properties:
          mission_id: {type: string, minLength: 1}
          goal_id: {type: string, minLength: 1}
          execution_id: {type: [string, 'null'], minLength: 1}
          action: {type: string, pattern: '^[a-z][a-z0-9_-]*$'}
          target_refs:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 1}
          constraints:
            type: array
            uniqueItems: true
            items: {type: string, minLength: 1}
          delegate_authority_id: {type: [string, 'null'], pattern: '^AUTH-[A-Z0-9][A-Z0-9-]*$'}
          delegated_actions:
            type: array
            uniqueItems: true
            items: {type: string, pattern: '^[a-z][a-z0-9_-]*$'}
          delegated_target_refs:
            type: array
            uniqueItems: true
            items: {type: string, minLength: 1}
        allOf:
          - if:
              properties: {action: {const: delegate_approval_authority}}
              required: [action]
            then:
              properties:
                delegate_authority_id: {type: string, pattern: '^AUTH-[A-Z0-9][A-Z0-9-]*$'}
                delegated_actions: {minItems: 1}
            else:
              properties:
                delegate_authority_id: {type: 'null'}
                delegated_actions: {maxItems: 0}
                delegated_target_refs: {maxItems: 0}
      decided_at:
        type: string
        format: date-time
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
      effective_at:
        type: string
        format: date-time
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
      expires_at:
        type: [string, 'null']
        format: date-time
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      delegation_ref: {type: [string, 'null'], pattern: '^APPROVAL-[0-9]{3,}$'}
      supersedes_ref: {type: [string, 'null'], pattern: '^APPROVAL-[0-9]{3,}$'}
      revokes_ref: {type: [string, 'null'], pattern: '^APPROVAL-[0-9]{3,}$'}
    allOf:
      - if:
          properties: {authority_role: {const: repository-owner}}
          required: [authority_role]
        then:
          properties:
            authorization_basis: {const: repository-ownership}
            delegation_ref: {type: 'null'}
      - if:
          properties: {authority_role: {const: delegate}}
          required: [authority_role]
        then:
          properties:
            authorization_basis: {const: delegated-authority}
            delegation_ref: {type: string, pattern: '^APPROVAL-[0-9]{3,}$'}
      - if:
          properties: {revokes_ref: {type: string}}
          required: [revokes_ref]
        then:
          properties:
            decision: {const: approved}
            scope:
              properties: {action: {const: revoke_approval}}
      - if:
          properties:
            scope:
              properties: {action: {const: revoke_approval}}
              required: [action]
          required: [scope]
        then:
          properties:
            revokes_ref: {type: string, pattern: '^APPROVAL-[0-9]{3,}$'}
