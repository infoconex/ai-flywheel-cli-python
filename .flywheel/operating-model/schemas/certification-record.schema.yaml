$schema: https://json-schema.org/draft/2020-12/schema
$id: certification-record.schema.yaml
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - framework_revision
  - framework_version
  - status
  - created_at
  - created_by
  - mission_id
  - goal_id
  - execution_id
  - cold_start_prompt
  - operator
  - scenarios
  - validator
  - known_limitations
  - finding_refs
  - corrective_actions
  - self_hosting
  - approval
  - overall_result
properties:
  schema_version: {type: integer, const: 1}
  id: {type: string, pattern: '^CERT-[0-9]{8}T[0-9]{6}Z-[0-9]{3}$'}
  framework_revision: {type: string, pattern: '^[0-9a-f]{40}$'}
  framework_version: {type: string, minLength: 1}
  status:
    type: string
    enum: [draft, ready-for-approval, approved, rejected, failed, superseded]
  created_at:
    type: string
    format: date-time
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
  created_by: {type: string, minLength: 1}
  mission_id: {type: string, minLength: 1}
  goal_id: {type: string, minLength: 1}
  execution_id: {type: string, pattern: '^EX-[0-9]{8}T[0-9]{6}Z-[0-9]{3}$'}
  cold_start_prompt: {type: string, minLength: 1}
  operator:
    type: object
    additionalProperties: false
    required: [system, identity, session_mode]
    properties:
      system: {type: string, minLength: 1}
      identity: {type: string, minLength: 1}
      session_mode: {type: string, enum: [context-free, continued, synthetic]}
  scenarios:
    type: array
    minItems: 10
    maxItems: 10
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - fixture_definition_refs
        - result
        - evidence_refs
        - actual_result
        - tested_framework_revision
        - evidence_revision
      properties:
        id: {type: integer, minimum: 1, maximum: 10}
        name:
          type: string
          enum:
            - context-free-startup
            - first-execution
            - resume
            - missing-artifact-recovery
            - broken-reference-recovery
            - approval-boundary
            - lifecycle-completeness
            - evidence-completeness
            - proving-mission
            - self-hosting
        fixture_definition_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        result: {type: string, enum: [passed, failed, not-run]}
        evidence_refs:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        actual_result: {type: string, minLength: 1}
        tested_framework_revision:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'
        evidence_revision: {type: string, pattern: '^[0-9a-f]{40}$'}
      allOf:
        - if:
            properties: {result: {const: passed}}
            required: [result]
          then:
            properties:
              evidence_refs: {minItems: 1}
              tested_framework_revision: {type: string, pattern: '^[0-9a-f]{40}$'}
        - if:
            properties: {result: {const: failed}}
            required: [result]
          then:
            properties: {evidence_refs: {minItems: 1}}
        - if:
            properties: {result: {const: not-run}}
            required: [result]
          then:
            properties:
              evidence_refs: {maxItems: 0}
              tested_framework_revision: {type: 'null'}
  validator:
    type: object
    additionalProperties: false
    required: [implementation_refs, json_schema_draft, yaml_version, format_enforcement]
    properties:
      implementation_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      json_schema_draft: {type: string, const: '2020-12'}
      yaml_version: {type: string, const: '1.2'}
      format_enforcement: {type: boolean, const: true}
  known_limitations:
    type: array
    items: {type: string, minLength: 1}
  finding_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  corrective_actions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, action, status, finding_ref]
      properties:
        id: {type: string, pattern: '^CA-[0-9]{3,}$'}
        action: {type: string, minLength: 1}
        status: {type: string, enum: [open, completed, deferred]}
        finding_ref: {type: [string, 'null'], minLength: 1}
  self_hosting:
    type: object
    additionalProperties: false
    required:
      - mission_ref
      - goal_ref
      - execution_ref
      - evidence_refs
      - validation_refs
      - persistence_plan_ref
    properties:
      mission_ref: {type: string, minLength: 1}
      goal_ref: {type: string, minLength: 1}
      execution_ref: {type: string, minLength: 1}
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      validation_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      persistence_plan_ref: {type: string, minLength: 1}
  approval:
    type: object
    additionalProperties: false
    required: [status, approval_ref, authority_id]
    properties:
      status: {type: string, enum: [pending, approved, rejected]}
      approval_ref: {type: [string, 'null'], pattern: '^APPROVAL-[0-9]{3,}$'}
      authority_id: {type: [string, 'null'], pattern: '^AUTH-[A-Z0-9][A-Z0-9-]*$'}
  overall_result: {type: string, enum: [pending-approval, passed, failed]}
allOf:
  - if:
      properties: {overall_result: {const: pending-approval}}
      required: [overall_result]
    then:
      properties:
        status: {const: ready-for-approval}
        scenarios:
          items:
            properties: {result: {const: passed}}
        approval:
          properties:
            status: {const: pending}
            approval_ref: {type: 'null'}
            authority_id: {type: 'null'}
  - if:
      properties: {overall_result: {const: passed}}
      required: [overall_result]
    then:
      properties:
        status: {const: approved}
        scenarios:
          items:
            properties: {result: {const: passed}}
        approval:
          properties:
            status: {const: approved}
            approval_ref: {type: string, pattern: '^APPROVAL-[0-9]{3,}$'}
            authority_id: {type: string, pattern: '^AUTH-[A-Z0-9][A-Z0-9-]*$'}
  - if:
      properties: {overall_result: {const: failed}}
      required: [overall_result]
    then:
      properties:
        status: {enum: [failed, rejected]}
        scenarios:
          contains:
            properties: {result: {const: failed}}
            required: [result]
          minContains: 1
