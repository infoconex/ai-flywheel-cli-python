notes:
  - This file describes the target repository and application; detailed operating-tool policies remain canonical in flywheel-context.yaml and capabilities.yaml.
  - No README, Python package metadata, source tree, tests, or automation were present during initial discovery.
  - The CLI must support installation into both empty repositories and repositories containing an existing project.
  - This repository is also the proving example for creating the CLI itself through the Flywheel mission and goal lifecycle.
  - After installation, the CLI should programmatically assist with lifecycle execution rather than serving only as an installer.
  - Implementation-policy decisions captured during goal 001 are inputs to later goals; no application implementation occurred during discovery.
