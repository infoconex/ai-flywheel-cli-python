schema_version: 1
purpose:
  value: >-
    Provide a Python command-line implementation that programmatically installs
    the AI Flywheel into an empty or existing repository and, after installation,
    assists operators in executing the Flywheel lifecycle.
  origin: provided
  status: confirmed
repository:
  type: bootstrap-cli-project
  example_role: self-hosting proving repository
  primary_artifacts:
    - .flywheel/manifest.yaml
    - .flywheel/state.yaml
    - .flywheel/operating-model
    - .flywheel/operations
application:
  languages:
    - Python
  frameworks:
    - Typer
  runtimes:
    - Python 3.11+
  architecture:
    - cross-platform command-line application
    - thin CLI adapter over independently testable application logic
    - dependency-aware and evolvable tooling
    - pyproject.toml packaging with a src layout
build:
  systems:
    - pyproject.toml
  commands:
    - python -m tools validate
testing:
  frameworks:
    - pytest
    - pytest-cov
    - coverage.py
  commands:
    - python -m tools test
    - python -m tools coverage
    - python -m tools validate
automation:
  local:
    - local developer environments
    - AI execution environments
  hosted: []
standards:
  coding:
    - Follow established Python industry standards and best practices.
    - Use Ruff for linting and formatting and mypy for static type checking.
  architecture:
    - Design for maintainability, extensibility, portability, and clear separation of concerns.
    - Keep domain and application behavior independent of Typer and terminal handling.
  testing:
    - Use unit, integration, and fixture-based end-to-end tests.
    - Enforce an initial minimum test coverage threshold of 80 percent.
constraints:
  platforms:
    - Windows
    - macOS
    - Linux
  security:
    - Bootstrap scripts must not modify a target repository until dependency and installation verification succeeds.
    - Provide an inspect-before-run alternative to direct remote-script execution.
    - Verify release archive checksums and reject unsafe archive paths, links, duplicate destinations, and manifest mismatches.
    - Redact secrets and tokens from output and diagnostics.
  compliance: []
  dependencies:
    - Detect required dependencies and compatibility before executing dependent operations.
    - Provide actionable diagnostics for missing or incompatible dependencies.
    - Allow dependency and tool requirements to evolve without coupling the CLI to one fixed environment.
    - Interactive bootstrap preserves user choice between uv and pipx when both are available.
    - Non-interactive bootstrap prefers uv, then pipx, then a managed Python virtual environment.
  network:
    - Initial installation may require network access.
    - Routine installed operations should work locally unless a command explicitly requires an external service.
    - Use bounded timeouts and limited retries only for safe idempotent network reads.
    - Do not depend on GitHub Actions or other hosted execution unless explicitly approved.
source_control:
  branch_strategy: mission-branch
  goal_commit_strategy: separate-goal-commits
  pull_request_strategy: one-pull-request-per-mission
  merge_authority: human-approval-required
  status: confirmed
unknowns: []
conflicts: []
