version: 1
validation_domains:
  operating_validation:
    purpose: Validate the Flywheel operating model, state, governance, schemas, references, startup contract, and operator invariants.
    startup_expected_state: passed
    allowed_states: [pending, passed, failed, blocked]
  repository_validation:
    purpose: Validate repository discovery, context gathering, inventory, constraints, and evidence collected during an authorized execution.
    startup_expected_state: pending
    allowed_states: [pending, in-progress, passed, failed, blocked]
  implementation_validation:
    purpose: Validate implementation changes through tests, acceptance criteria, evidence, and required approvals.
    startup_expected_state: not-applicable
    allowed_states: [not-applicable, pending, in-progress, passed, failed, blocked]
bootstrap:
  manual_operating_validation:
    required_when_validator_unavailable: true
    use_published_contract: true
    equivalent_authority_to_automated_validation: true
artifact_validation:
  require_required_files: true
  require_schema_validation: true
  require_reference_validation: true
  require_unique_active_mission: true
  require_unique_active_goal: true
  require_zero_or_one_active_execution: true
  require_state_execution_consistency: true
  require_goal_filename_matches_id: true
  require_acceptance_criterion_ids: true
  require_evidence_criterion_mapping: true
  require_operator_invariants: true
  require_startup_contract: true
  require_execution_transition_rules: true
  require_transition_recovery_contract: true
  require_readiness_transition_rules: true
  require_provenance_for_material_values: true
  schemas:
    manifest: .flywheel/operating-model/schemas/manifest.schema.yaml
    state: .flywheel/operating-model/schemas/state.schema.yaml
    mission: .flywheel/operating-model/schemas/mission.schema.yaml
    goal: .flywheel/operating-model/schemas/goal.schema.yaml
    execution: .flywheel/operating-model/schemas/execution.schema.yaml
    record: .flywheel/operating-model/schemas/record.schema.yaml
    approval_record: .flywheel/operating-model/schemas/approval-record.schema.yaml
    certification_record: .flywheel/operating-model/schemas/certification-record.schema.yaml
    readiness_validation: .flywheel/operating-model/schemas/readiness-validation.schema.yaml
    knowledge: .flywheel/operating-model/schemas/knowledge.schema.yaml
    persistence_plan: .flywheel/operating-model/schemas/persistence-plan.schema.yaml
    reuse_assessment: .flywheel/operating-model/schemas/reuse-assessment.schema.yaml
    startup_failure: .flywheel/operating-model/schemas/startup-failure.schema.yaml
adapt_completion_contract:
  guidance: .flywheel/operating-model/guidance/adaptation.md
  authoritative_matrix: authoritative-adapt-completion-matrix
  require_final_disposition: true
  permitted_dispositions: [approved, rejected, deferred]
  prohibit_proposed_at_completion: true
  prohibit_in_progress_implementation_at_completion: true
  approved_requires:
    implementation_status: completed
    validation_status: pending
    decision_ref: required
    approval_refs_when_required: required
  rejected_requires:
    implementation_status: not-applicable
    validation_status: not-applicable
    decision_ref: required
  deferred_requires:
    implementation_status: not-started
    validation_status: not-applicable
    decision_ref: required
    approval_status_when_required: pending
    approval_status_when_not_required: not-required
    prohibit_approved_or_rejected_approval_status: true
  new_goal_required_requires:
    disposition: deferred
    implementation_status: not-started
    validation_status: not-applicable
    decision_ref: required
    approval_status_when_required: pending
  unresolved_action: block-or-interrupt
  semantic_rule_ids: [ADAPT-COMPLETE-001, ADAPT-COMPLETE-002, ADAPT-COMPLETE-003, ADAPT-COMPLETE-004, ADAPT-COMPLETE-005, ADAPT-COMPLETE-006, ADAPT-COMPLETE-007, ADAPTATION-DEFERRAL-001]
validation_contract:
  guidance: .flywheel/operating-model/guidance/validation.md
  require_stable_identity: true
  identity_pattern: '^VAL-[0-9]{3,}$'
  require_adaptation_targets: true
  require_criterion_or_rule_basis: true
  require_plan_before_execution: true
  require_method: true
  require_immutable_scope: true
  require_expected_outcome: true
  require_expected_evidence: true
  require_actual_outcome_after_execution: true
  require_evidence_for_pass_or_fail: true
  require_finding_and_recovery_for_failure: true
  require_eligibility_determination: true
  require_adaptation_status_synchronization: true
  prohibit_success_for_unimplemented_work: true
  prohibit_silent_scope_weakening_after_failure: true
  require_supersedes_reference_for_revised_validation: true
transition_recovery_contract:
  guidance: .flywheel/operating-model/guidance/transition-recovery.md
  record_schema: .flywheel/operating-model/schemas/record.schema.yaml
  partial_finding_type: partial-lifecycle-transition
  require_structured_recovery_payload: true
  require_original_plan_identity: true
  require_original_plan_path: true
  require_transition_operator_and_timestamps: true
  require_complete_target_snapshots: true
  require_retained_revisions_and_digests: true
  require_proposed_digests: true
  require_observed_revisions_and_digests: true
  require_per_target_write_results: true
  require_failure_condition: true
  require_structured_rollback_result: true
  require_original_pair_restoration_status: true
  require_continuation_disposition: true
  require_recovery_action: true
  require_human_reconciliation_disposition: true
  require_plan_reference: true
  require_cross_artifact_identity_match: true
  require_target_match_to_original_plan: true
  require_revision_and_digest_match_to_durable_artifacts: true
  require_outcome_consistency: true
  reject_missing_or_ambiguous_recovery_data: true
  semantic_rule_ids: [TRANSITION-FINDING-001, TRANSITION-FINDING-CONTENT-001, TRANSITION-FINDING-PLAN-001, TRANSITION-FINDING-REVISION-001, TRANSITION-FINDING-OUTCOME-001]
persistence_contract:
  guidance: .flywheel/operating-model/guidance/persistence.md
  plan_schema: .flywheel/operating-model/schemas/persistence-plan.schema.yaml
  require_plan_before_activation: true
  plan_is_transaction_controller: true
  terminal_applied_plan_is_commit_marker: true
  governed_completion_values_are_pending_until_commit: true
  prohibit_reporting_pending_completion_values: true
  require_blocking_reconciliation_when_commit_marker_finalization_fails: true
  prohibit_plan_in_own_targets: true
  prohibit_plan_in_own_write_order: true
  prohibit_plan_self_digest: true
  require_plan_create_before_governed_writes: true
  require_plan_cas_while_active: true
  require_terminal_plan_immutability: true
  require_complete_target_set: true
  require_canonical_locations: true
  require_per_target_operation: true
  require_per_target_mutability: true
  require_per_target_precondition: true
  require_per_target_digest: true
  digest_algorithm: sha256
  digest_encoding: lowercase-hex
  digest_bytes: normalized-utf8-lf-no-bom
  require_dependency_order: true
  canonical_type_order: [evidence, decision, finding, approval, certification, readiness-validation, reuse-assessment, knowledge, context, goal, mission, execution, state]
  state_is_final_operational_pointer: true
  require_create_absence_recheck: true
  require_update_sha_recheck: true
  require_per_write_reread: true
  require_whole_set_final_verification: true
  require_reverse_order_recovery: true
  require_compensating_finding_for_orphans: true
  block_on_unrecoverable_partial_persistence: true
  prohibit_unplanned_writes: true
  prohibit_history_overwrite: true
  prohibit_reuse_claims_during_persist: true
  semantic_rule_ids: [PERSIST-PLAN-001, PERSIST-PLAN-SELF-001, PERSIST-PLAN-LIFECYCLE-001, PERSIST-COMMIT-001, PERSIST-DIGEST-001, PERSIST-TARGET-001, PERSIST-LOCATION-001, PERSIST-MUTABILITY-001, PERSIST-CERTIFICATION-001, PERSIST-ORDER-001, PERSIST-PRECHECK-001, PERSIST-VERIFY-001, PERSIST-ROLLBACK-001, PERSIST-PARTIAL-001, PERSIST-HISTORY-001, PERSIST-REUSE-001]
reuse_contract:
  guidance: .flywheel/operating-model/guidance/reuse.md
  assessment_schema: .flywheel/operating-model/schemas/reuse-assessment.schema.yaml
  knowledge_schema: .flywheel/operating-model/schemas/knowledge.schema.yaml
  require_completed_verified_persist: true
  require_structured_assessment: true
  require_candidate_and_existing_knowledge_dispositions: true
  require_evidence_and_validation_provenance_for_promotion: true
  require_applicability: true
  require_limitations_assessment: true
  require_actionable_reuse_guidance: true
  require_duplicate_search: true
  require_conflict_resolution: true
  require_new_identity_for_revision: true
  require_supersedes_linkage: true
  require_approval_for_material_guidance: true
  require_existing_knowledge_disposition: true
  require_dedicated_persistence_plan: true
  require_durable_assessments_and_knowledge_before_completion: true
  terminal_reuse_plan_commits_lifecycle_closure: true
  require_adaptation_status_synchronization: true
  prohibit_direct_observation_promotion: true
  prohibit_unvalidated_promotion: true
  prohibit_history_overwrite: true
  semantic_rule_ids: [REUSE-ACTIVATE-001, REUSE-ASSESS-001, REUSE-PROMOTE-001, REUSE-DIRECT-001, REUSE-DUPLICATE-001, REUSE-CONFLICT-001, REUSE-SUPERSEDE-001, REUSE-APPROVAL-001, REUSE-EXISTING-001, REUSE-DURABILITY-001, REUSE-SYNC-001, REUSE-COMPLETE-001, REUSE-HISTORY-001]
certification_contract:
  config: .flywheel/operating-model/config/certification-validation.yaml
  guidance: .flywheel/operating-model/guidance/certification.md
  certification_schema: .flywheel/operating-model/schemas/certification-record.schema.yaml
  readiness_schema: .flywheel/operating-model/schemas/readiness-validation.schema.yaml
  require_exact_ten_scenarios: true
  require_source_revision_and_evidence: true
  require_self_hosting_artifact_refs: true
  require_persistence_plan: true
  require_human_approval_for_pass: true
  allow_ready_for_approval_without_readiness_change: true
  prohibit_assumed_approval: true
  prohibit_readiness_transition_while_pending: true
  semantic_rule_ids: [CERT-SCENARIO-001, CERT-EVIDENCE-001, CERT-VALIDATOR-001, CERT-SELF-HOST-001, CERT-APPROVAL-001, CERT-RESULT-001, READINESS-RECORD-001, READINESS-GATE-001, READINESS-APPROVAL-001, READINESS-PERSIST-001, READINESS-STATE-001]
completion:
  require_acceptance_criteria: true
  require_evidence_per_criterion: true
  require_approvals: true
  require_all_lifecycle_stages_recorded: true
  allow_not_applicable_stage_with_reason: true
  prohibit_unresolved_blocking_uncertainty: true
  prohibit_pending_required_validation: true
  prohibit_failed_required_validation_without_authorized_disposition: true
onboarding:
  require_repository_context: true
  require_flywheel_context: true
  require_governance_confirmation: true
  require_validation_confirmation: true
  require_tool_requirements_before_design: true
  require_human_approval_before_implementation: true
readiness:
  required_state: ready-for-missions
  require_artifact_validation: true
  require_certification: true
  require_certification_record_schema: true
  require_readiness_validation_record: true
  require_cold_start_test: true
  require_first_execution_test: true
  require_resume_test: true
  require_recovery_tests: true
  require_approval_boundary_test: true
  require_self_hosting: true
  require_proving_mission: true
  require_human_approval: true
  require_onboarding_completion: true
  require_terminal_applied_persistence_plan: true
  prohibit_transition_from_pending_certification: true
  required_capabilities: [mission-management, goal-management, execution-recording, lifecycle-enforcement, evidence-capture, completion-validation, classification-recording, knowledge-persistence]
cold_start_test:
  prompt: Read this repository and operate according to its AI Flywheel.
  expected:
    - discovers AGENTS.md and manifest entrypoint
    - reads all required files
    - emits the fixed opening report headings in required order
    - reports operating, repository, and implementation validation independently
    - creates or resumes the correct execution before goal-directed work
    - treats absence of prior executions as expected for a first execution
    - does not invent files or perform application work during onboarding
    - records all lifecycle stages
validator_output:
  require_rule_id: true
  require_artifact_path: true
  require_severity: true
  require_message: true
  require_recovery_action: true
  prohibit_silent_normalization: true
provenance:
  allowed: [discovered, provided, inferred, defaulted, approved, deferred, rejected]
  require_approval_for_material_inference: true
