schema_version: 1
implementation:
  language:
    value: Python
    status: candidate
    origin: provided
  runtime:
    value: Python 3.11+
    status: confirmed
    origin: provided
  architecture:
    value: evolvable command-line tooling with dependency detection
    status: candidate
    origin: provided
  test_framework:
    value: pytest
    status: confirmed
    origin: provided
  coverage:
    tooling:
      - pytest-cov
      - coverage.py
    minimum_percent: 80
    enforcement: required
    status: confirmed
    origin: provided
  code_quality:
    linting: Ruff
    formatting: Ruff
    type_checking: mypy
    status: confirmed
    origin: provided
  command_interface:
    value: flywheel
    status: confirmed
    origin: provided
  location:
    value: .flywheel/tools
    status: defaulted
    origin: defaulted
  storage:
    value: repository-files
    status: defaulted
    origin: defaulted
  logging:
    sinks: []
    structure: null
  dependencies:
    allowed:
      - uv
      - pipx
      - Python virtual environment
      - pytest
      - pytest-cov
      - coverage.py
      - Ruff
      - mypy
    prohibited: []
  supported_platforms:
    - Windows
    - macOS
    - Linux
capability_implementation: []
manual_fallbacks:
  - Detect required runtime and tool dependencies before attempting operations.
  - Report missing or incompatible dependencies with actionable remediation rather than failing ambiguously.
  - When neither uv nor pipx is available, offer to install a supported tool or use a managed virtual environment.
  - In non-interactive environments, use uv when available, otherwise pipx, otherwise a managed virtual environment.
  - If .flywheel already exists, refuse installation and direct the user to the explicit upgrade command.
  - Before writing repository files, show the planned changes and require explicit confirmation or an apply flag.
known_limitations:
  - Standalone distribution strategy remains unresolved.
  - Initial installation requires network access; downloadable offline installation bundles are deferred.
decisions:
  - id: INSTALL-PREFERENCE-001
    status: candidate
    origin: provided
    statement: Provide two small one-command bootstrap entry points, one for macOS and Linux and one for Windows PowerShell.
    evidence_ref: EVIDENCE-004
  - id: RUNTIME-BASELINE-001
    status: confirmed
    origin: provided
    statement: Support Python 3.11 and newer as the initial runtime baseline.
    evidence_ref: EVIDENCE-006
  - id: COMMAND-NAME-001
    status: confirmed
    origin: provided
    statement: Expose the CLI using the command name flywheel.
    evidence_ref: EVIDENCE-007
  - id: BOOTSTRAP-INSTALLER-001
    status: confirmed
    origin: provided
    statement: >-
      Bootstrap scripts detect uv and pipx, ask the user to choose when both are
      available, and offer installation or a managed virtual environment when
      neither is available.
    evidence_ref: EVIDENCE-008
  - id: NONINTERACTIVE-INSTALLER-001
    status: confirmed
    origin: provided
    statement: >-
      In non-interactive environments, prefer uv, then pipx, then a managed
      Python virtual environment without prompting.
    evidence_ref: EVIDENCE-009
  - id: EXISTING-INSTALLATION-001
    status: confirmed
    origin: provided
    statement: >-
      The install command refuses when .flywheel already exists and requires the
      user to invoke a separate explicit upgrade command.
    evidence_ref: EVIDENCE-010
  - id: OFFLINE-MODEL-001
    status: confirmed
    origin: provided
    statement: >-
      Initial installation requires internet access, while normal lifecycle
      operations should work locally after installation.
    evidence_ref: EVIDENCE-011
  - id: INSTALL-APPROVAL-BOUNDARY-001
    status: confirmed
    origin: provided
    statement: >-
      Interactive installation shows the complete change plan and requires
      confirmation; non-interactive installation requires an explicit --yes or
      --apply flag before writing repository files.
    evidence_ref: EVIDENCE-012
  - id: TEST-FRAMEWORK-001
    status: confirmed
    origin: provided
    statement: Use pytest as the project's initial automated test framework.
    evidence_ref: EVIDENCE-014
  - id: CODE-QUALITY-001
    status: confirmed
    origin: provided
    statement: Use Ruff for linting and formatting and mypy for static type checking.
    evidence_ref: EVIDENCE-015
  - id: COVERAGE-ENFORCEMENT-001
    status: confirmed
    origin: provided
    statement: Enforce test coverage from the first release with an initial minimum threshold of 80 percent.
    evidence_ref: EVIDENCE-016
notes:
  - Flywheel implementation choices are independent from target application technologies.
  - Material selections remain candidates until the required approval is recorded.
  - The CLI must run in both local developer environments and AI execution environments.
  - Tooling should be designed to evolve as Flywheel capabilities and dependency requirements change.
  - Implementation must follow established Python industry standards and engineering best practices.
  - The bootstrap entry points should detect prerequisites, install or invoke the CLI through the selected package mechanism, verify the installation, and avoid modifying a target repository until checks pass.
  - Documentation should provide both the one-command form and a download-inspect-run alternative.
  - Interactive installation should preserve user choice instead of silently preferring one detected installer.
  - Non-interactive installation must be deterministic and must not block waiting for user input.
  - Installation and upgrade are separate operations; installation must never replace an existing Flywheel installation.
  - Once the CLI and framework content are installed, routine lifecycle operations should not require network access unless a specific command explicitly depends on an external service.
  - Planning and validation are read-only; repository changes occur only after the explicit application boundary is satisfied.
  - Coverage enforcement begins at 80 percent and may be raised later through an approved project-standard change.
