schema_version: 1
id: implement-programmatic-flywheel-operations
title: Implement Programmatic Flywheel Operations
status: active
objective: Provide complete, schema-valid, command-driven management of missions, goals, executions, lifecycle stages, records, approvals, and state transitions so operators do not need to edit Flywheel artifacts manually.
constraints:
  - Preserve human approval boundaries defined by the operating model.
  - Do not weaken schema, reference, lifecycle, evidence, or readiness validation.
  - All multi-artifact mutations must be atomic or durably recoverable.
  - Commands must support deterministic machine-readable output.
  - Programmatic operations must remain implementation-neutral at the framework contract level even though this repository uses Python and Typer.
  - Do not start implementation goals until cross-repository contract changes are reviewed and approved or explicitly deferred.
success_criteria:
  - id: MSC-001
    statement: Mission and goal operations are available through validated programmatic commands.
  - id: MSC-002
    statement: Execution and all eight lifecycle-stage transitions are programmatically managed.
  - id: MSC-003
    statement: Evidence, findings, decisions, approvals, and reusable knowledge can be created and referenced programmatically.
  - id: MSC-004
    statement: State and related artifacts are updated atomically with deterministic recovery behavior.
  - id: MSC-005
    statement: Approval-required transitions cannot occur without durable authorization.
  - id: MSC-006
    statement: Positive and negative end-to-end tests prove the complete operations capability profile.
  - id: MSC-007
    statement: The specification, framework, and testing repositories reflect the programmatic operations contract used by the CLI.
goals:
  - 001-align-cross-repository-operations-contract
  - 002-implement-mission-and-goal-operations
  - 003-implement-execution-and-lifecycle-operations
  - 004-implement-record-and-approval-operations
  - 005-implement-atomic-transitions-and-recovery
  - 006-self-host-and-certify-programmatic-operations
approvals_required:
  - Mission kickoff approval
  - Cross-repository contract approval before implementation goals begin
  - Approval before any readiness or capability claim is broadened
