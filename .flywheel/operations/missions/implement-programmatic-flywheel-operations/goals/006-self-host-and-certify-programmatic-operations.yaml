schema_version: 1
id: 006-self-host-and-certify-programmatic-operations
mission_id: implement-programmatic-flywheel-operations
title: Prove Hybrid AI and Deterministic Operation
status: active
objective: Complete a representative mission with AI as the operator, using deterministic tools for the operations selected in Goal 002 and governed AI execution for the remaining activities, then evaluate whether the tools delivered measurable value.
depends_on:
  - 005-implement-atomic-transitions-and-recovery
procedure:
  - Record the exact deterministic operations implemented and the activities intentionally left AI-executed.
  - Start a representative mission after kickoff approval.
  - Have the AI operator invoke deterministic tools where supported and use governed artifact execution elsewhere.
  - Exercise positive, negative, approval, conflict, retry, interruption, and recovery scenarios for supported operations.
  - Compare reliability, effort, consistency, and reuse against the prior AI-only operating evidence where comparison is meaningful.
  - Persist conclusions about which operations should remain deterministic, be expanded, be revised, or return to AI execution.
acceptance_criteria:
  - id: AC-001
    statement: A representative mission completes with AI visibly retaining operator responsibility and human authority preserved.
  - id: AC-002
    statement: Every supported deterministic operation is exercised successfully within its declared boundary.
  - id: AC-003
    statement: Activities outside the deterministic scope are completed through governed AI execution without being treated as implementation gaps.
  - id: AC-004
    statement: Negative and interruption tests prove the safety claims made for supported operations.
  - id: AC-005
    statement: The evaluation measures whether deterministic tooling improved reliability, consistency, effort, cost, or reuse.
  - id: AC-006
    statement: Human authority approves the final assessment and any recommendation to expand the determinism boundary.
evidence_required:
  - criterion_id: AC-001
    artifacts: [hybrid mission transcript and records]
  - criterion_id: AC-002
    artifacts: [supported-operation coverage map]
  - criterion_id: AC-003
    artifacts: [AI-executed activity record]
  - criterion_id: AC-004
    artifacts: [negative interruption and recovery results]
  - criterion_id: AC-005
    artifacts: [deterministic value evaluation]
  - criterion_id: AC-006
    artifacts: [human assessment approval]
approvals_required:
  - Representative mission kickoff approval
  - Final deterministic tooling assessment approval
