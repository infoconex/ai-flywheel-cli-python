schema_version: 1
id: 005-implement-atomic-transitions-and-recovery
mission_id: implement-programmatic-flywheel-operations
title: Prove Interruption, Retry, and Idempotency Safety
status: completed
objective: Prove deterministic interruption recovery, retry behavior, and idempotency for start-execution and advance-lifecycle without expanding the supported operation set.
depends_on:
  - 004-implement-record-and-approval-operations
procedure:
  - Define observable interruption points only for start-execution, advance-lifecycle, and their shared mutation boundary.
  - Add injected interruption tests that verify canonical artifacts are restored or remain unchanged after partial write attempts.
  - Define deterministic retry behavior for validation rejection, stale-source rejection, and interrupted persistence.
  - Prove repeated equivalent requests do not create duplicate executions, duplicate transitions, or silently divergent state.
  - Document the exact safety guarantees and unsupported cases for each implemented operation.
  - Do not add new operation families, general recovery services, or blanket programmatic safety claims.
acceptance_criteria:
  - id: AC-001
    statement: Injected interruption tests prove that start-execution and advance-lifecycle do not leave silently inconsistent partial canonical state.
  - id: AC-002
    statement: Retry behavior after validation rejection, stale-source rejection, and interrupted persistence is deterministic and documented.
  - id: AC-003
    statement: Repeated equivalent requests are idempotent or are rejected with an explicit deterministic result without duplicate artifacts or transitions.
  - id: AC-004
    statement: A supported-operation safety matrix states the tested guarantees, retry behavior, recovery behavior, and unsupported cases for each implemented operation.
  - id: AC-005
    statement: Full automated tests and repository validation pass, and safety claims remain limited to start-execution, advance-lifecycle, and their shared mutation boundary.
evidence_required:
  - criterion_id: AC-001
    artifacts: [interruption injection tests, partial-write verification]
  - criterion_id: AC-002
    artifacts: [retry behavior tests, retry and recovery report]
  - criterion_id: AC-003
    artifacts: [idempotency and duplicate-prevention tests]
  - criterion_id: AC-004
    artifacts: [supported-operation safety matrix]
  - criterion_id: AC-005
    artifacts: [complete test report, repository validation result, scope review]
