schema_version: 1
id: 005-implement-atomic-transitions-and-recovery
mission_id: implement-programmatic-flywheel-operations
title: Harden Deterministic Mutation and Recovery
status: proposed
objective: Ensure each implemented mutating operation is conflict-safe, retry-safe, and either atomic or durably recoverable, while leaving nonimplemented activities under governed AI control.
depends_on:
  - 004-implement-record-and-approval-operations
procedure:
  - Define the transaction boundary and write ordering for each implemented mutating operation.
  - Detect stale revisions and conflicting concurrent changes before canonical state is overwritten.
  - Stage and validate complete proposed changes before commit where practical.
  - Use the framework persistence and transition-recovery rules when a mutation spans multiple artifacts.
  - Define deterministic retry, resume, rollback, and conflict behavior for each supported mutation.
  - Add interruption and conflict injection tests only for the implemented mutation paths.
acceptance_criteria:
  - id: AC-001
    statement: No implemented operation leaves silently inconsistent partial state after an injected interruption.
  - id: AC-002
    statement: Conflicting mutations are rejected before canonical state is overwritten.
  - id: AC-003
    statement: Validation failure prevents durable mutation or results in a governed recoverable state.
  - id: AC-004
    statement: Retry and recovery behavior is deterministic for every implemented mutating operation.
  - id: AC-005
    statement: Safety claims are limited to tested operations and do not imply blanket programmatic coverage.
evidence_required:
  - criterion_id: AC-001
    artifacts: [interruption injection tests]
  - criterion_id: AC-002
    artifacts: [conflict detection tests]
  - criterion_id: AC-003
    artifacts: [validation and recovery tests]
  - criterion_id: AC-004
    artifacts: [retry and idempotency report]
  - criterion_id: AC-005
    artifacts: [supported-operation safety matrix]
