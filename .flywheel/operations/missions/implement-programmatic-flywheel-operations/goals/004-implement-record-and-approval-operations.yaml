schema_version: 1
id: 004-implement-record-and-approval-operations
mission_id: implement-programmatic-flywheel-operations
title: Build Shared Validation and Mutation Safety
status: proposed
objective: Build reusable validation, reference, approval, and mutation-safety services needed by the selected deterministic operations without requiring every Flywheel activity to use code.
depends_on:
  - 003-implement-execution-and-lifecycle-operations
procedure:
  - Extract shared schema, identity, placement, reference, and state-consistency checks used by selected operations.
  - Centralize approval verification while preventing tools or the AI operator from self-authorizing restricted transitions.
  - Validate complete proposed mutations before canonical artifacts are changed.
  - Preserve useful structured errors that allow the AI operator to understand and recover from rejected operations.
  - Avoid adding unused abstractions for operation families outside the approved scope.
  - Add focused tests for malformed inputs, broken references, approval misuse, and inconsistent proposed state.
acceptance_criteria:
  - id: AC-001
    statement: Selected deterministic operations use shared validation rather than duplicating critical governance rules.
  - id: AC-002
    statement: Identity, placement, references, and affected state are validated before persistence.
  - id: AC-003
    statement: Approval-required actions cannot proceed without durable matching human authorization.
  - id: AC-004
    statement: Rejected operations return actionable structured results that support governed AI recovery.
  - id: AC-005
    statement: Shared services are limited to demonstrated needs and are covered by positive and negative tests.
evidence_required:
  - criterion_id: AC-001
    artifacts: [shared validation source, reuse mapping]
  - criterion_id: AC-002
    artifacts: [identity reference and state validation tests]
  - criterion_id: AC-003
    artifacts: [approval boundary tests]
  - criterion_id: AC-004
    artifacts: [structured failure and recovery tests]
  - criterion_id: AC-005
    artifacts: [scope review and test report]
