schema_version: 1
id: 002-implement-mission-and-goal-operations
mission_id: implement-programmatic-flywheel-operations
title: Implement Mission and Goal Operations
status: proposed
objective: Add schema-valid programmatic commands for creating, reading, updating, listing, filtering, activating, blocking, completing, cancelling, and validating missions and goals.
depends_on:
  - 001-align-cross-repository-operations-contract
procedure:
  - Implement command-neutral service operations before CLI presentation logic.
  - Add mission create, update, show, list, activate, block, complete, and cancel operations.
  - Add goal create, update, show, list, activate, block, complete, and cancel operations.
  - Support deterministic filters for status, mission, blocked state, and dependency state.
  - Enforce schema, identity, parent, dependency, approval, and active-state invariants.
  - Add dry-run and deterministic JSON output for mutations.
acceptance_criteria:
  - id: AC-001
    statement: Mission CRUD and lifecycle-status operations are available programmatically and preserve all schema invariants.
  - id: AC-002
    statement: Goal CRUD and lifecycle-status operations are available programmatically and preserve parent and dependency invariants.
  - id: AC-003
    statement: Mission and goal list operations support deterministic filtering and ordering.
  - id: AC-004
    statement: Invalid, unauthorized, or conflicting changes fail without partial mutation.
  - id: AC-005
    statement: Positive and negative automated tests cover every supported mission and goal operation.
evidence_required:
  - criterion_id: AC-001
    artifacts: [mission operation source, mission operation tests]
  - criterion_id: AC-002
    artifacts: [goal operation source, goal operation tests]
  - criterion_id: AC-003
    artifacts: [list and filter tests]
  - criterion_id: AC-004
    artifacts: [negative mutation and rollback tests]
  - criterion_id: AC-005
    artifacts: [test and coverage report]
