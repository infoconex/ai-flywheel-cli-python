finding:
  finding_type: improvement
  statement: The CLI contract needed an explicit sequential registry and stable category/reason fields so automation can branch safely without inferring meaning from ad hoc failures.
  impact: Without explicit contract stabilization, callers could mis-handle failures or rely on unstable implicit mappings.
  resolution: Added explicit exit-code constants and mapping behavior, documented 0/1/2 semantics and platform-dependent runtime statuses, and added regression tests for each deliberately emitted Flywheel exit code.
