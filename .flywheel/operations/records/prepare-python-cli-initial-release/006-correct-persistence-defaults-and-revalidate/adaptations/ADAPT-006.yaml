adaptation:
  type: guidance
  statement: Keep persistence-generated reuse records goal-neutral, validate the active repository through an editable installation, and treat tags, releases, uploads, publication, and hosted automation as separate human-approved actions.
  affected_scope:
  - src/ai_flywheel_cli/persistence.py
  - tests/test_persistence.py
  - README.md
  - local development and release validation workflow
  rationale: Neutral defaults prevent prior-goal leakage, editable installation ensures tests exercise current source, and explicit approval boundaries prevent technical readiness from being mistaken for release authorization.
  intended_effect: Preserve reusable persistence behavior, trustworthy local validation, and human authority over external release actions.
  alternatives:
  - Allow goal-specific persistence defaults.
  - Validate against a copied site-packages installation.
  - Treat successful local validation as implicit release approval.
